name: Register Account

on:
  workflow_dispatch:

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Register Bitwarden account on Warden worker
        env:
          WARDEN_EMAIL: ${{ secrets.WARDEN_EMAIL }}
          WARDEN_MASTER_PASSWORD: ${{ secrets.WARDEN_MASTER_PASSWORD }}
          BASE_URL: https://warden-worker.tianhesl.workers.dev
        run: node scripts/register.js
