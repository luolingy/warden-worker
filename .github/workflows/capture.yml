name: Capture bw Requests

on:
  workflow_dispatch:

jobs:
  cap:
    runs-on: ubuntu-latest
    steps:
      - name: Capture
        run: |
          cat > /tmp/echo.js <<'EOF'
          const http = require('http');
          http.createServer((req, res) => {
            let body = '';
            req.on('data', c => body += c);
            req.on('end', () => {
              console.log('REQ', req.method, req.url, 'CT=' + (req.headers['content-type']||''), 'BODY=' + body.slice(0,200));
              if (req.url.includes('prelogin')) {
                res.writeHead(200, {'content-type':'application/json'});
                res.end(JSON.stringify({kdf:0,kdfIterations:600000,kdfMemory:null,kdfParallelism:null}));
              } else if (req.url.includes('config')) {
                res.writeHead(200, {'content-type':'application/json'});
                res.end(JSON.stringify({version:'2025.12.0',server:{name:'Vaultwarden',url:''},settings:{disableUserRegistration:true},environment:{vault:'http://127.0.0.1:8799',api:'http://127.0.0.1:8799/api',identity:'http://127.0.0.1:8799/identity',notifications:null},featureStates:{},object:'config'}));
              } else {
                res.writeHead(404, {'content-type':'application/json'});
                res.end('{}');
              }
            });
          }).listen(8799, '127.0.0.1', () => console.log('echo listening'));
          EOF
          node /tmp/echo.js & SERVER_PID=$!
          sleep 1
          npm install -g @bitwarden/cli >/dev/null 2>&1
          bw config server http://127.0.0.1:8799 >/dev/null 2>&1
          bw login "test@example.com" "SomePassword123" 2>&1 | head -5 || true
          sleep 1
          kill $SERVER_PID || true
