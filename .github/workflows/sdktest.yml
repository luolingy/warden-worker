name: SDK Decrypt Test

on:
  workflow_dispatch:

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install sdk
        run: npm install --no-save @bitwarden/sdk-internal
      - name: test decrypt
        env:
          WARDEN_EMAIL: ${{ secrets.WARDEN_EMAIL }}
          WARDEN_MASTER_PASSWORD: ${{ secrets.WARDEN_MASTER_PASSWORD }}
          BASE_URL: https://warden-worker.tianhesl.workers.dev
        run: |
          cat > sdk_test.js <<'EOF'
          const crypto = require('crypto');
          const https = require('https');
          const qs = require('querystring');
          const B = process.env.BASE_URL, E = process.env.WARDEN_EMAIL, P = process.env.WARDEN_MASTER_PASSWORD;
          const mKey = crypto.pbkdf2Sync(Buffer.from(P), Buffer.from(E.toLowerCase()), 600000, 32, 'sha256');
          const mph = crypto.pbkdf2Sync(mKey, Buffer.from(P), 1, 32, 'sha256').toString('base64');
          const body = qs.stringify({grant_type:'password',username:E,password:mph,scope:'api offline_access',client_id:'web',deviceType:'10',deviceIdentifier:'d-'+crypto.randomUUID()});
          const u = new URL(B + '/identity/connect/token');
          const req = https.request({hostname:u.hostname,path:u.pathname,method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded','Content-Length':Buffer.byteLength(body)}},res=>{
            let d='';res.on('data',c=>d+=c);res.on('end', async ()=>{
              const j=JSON.parse(d);
              const mpu=j.UserDecryptionOptions.MasterPasswordUnlock;
              console.log('salt len', (mpu.Salt||'').length, 'kdf', JSON.stringify(mpu.Kdf));
              let sdk;
              try { sdk = require('@bitwarden/sdk-internal'); console.log('sdk keys', Object.keys(sdk).slice(0,20).join(',')); }
              catch(e){ console.log('require fail', e.message); process.exit(1); }
              // Try PureCrypto if exposed
              try {
                const PureCrypto = sdk.PureCrypto || (sdk.default && sdk.default.PureCrypto);
                console.log('PureCrypto?', !!PureCrypto, PureCrypto?Object.getOwnPropertyNames(Object.getPrototypeOf(PureCrypto)):'');
                if (PureCrypto && PureCrypto.decrypt_user_key_with_master_password) {
                  const kdfConfig = { kdfType: 0, iterations: 600000, memory: null, parallelism: null };
                  const out = PureCrypto.decrypt_user_key_with_master_password(mpu.MasterKeyWrappedUserKey, P, mpu.Salt, kdfConfig);
                  console.log('DECRYPT OK, userKey len', out && out.length);
                } else { console.log('no decrypt fn'); }
              } catch(e) {
                console.log('DECRYPT ERROR:', e.message || e);
              }
            });
          });
          req.on('error',e=>console.log('ERR',e.message));req.write(body);req.end();
          EOF
          node sdk_test.js 2>&1 | head -40
