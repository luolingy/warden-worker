name: Verify Login

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install SDK
        run: npm install --no-save @bitwarden/sdk-internal
      - name: Verify login + SDK unwrap
        env:
          WARDEN_EMAIL: ${{ secrets.WARDEN_EMAIL }}
          WARDEN_MASTER_PASSWORD: ${{ secrets.WARDEN_MASTER_PASSWORD }}
          BASE_URL: https://warden-worker.tianhesl.workers.dev
        run: node scripts/verify.js
