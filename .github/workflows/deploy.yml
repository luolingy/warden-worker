name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy Warden Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + wasm target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install lld (wasm linker)
        run: sudo apt-get update && sudo apt-get install -y lld clang

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install worker-build and wasm-bindgen-cli
        run: |
          if ! command -v worker-build >/dev/null 2>&1; then
            cargo install worker-build --locked || cargo install worker-build
          fi
          WASM_BINDGEN_VER=$(grep -m1 '^name = "wasm-bindgen"$' -A1 Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          echo "wasm-bindgen version in lock: $WASM_BINDGEN_VER"
          if ! command -v wasm-bindgen >/dev/null 2>&1; then
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VER" \
              || cargo install wasm-bindgen-cli
          fi

      - name: Install Wrangler CLI
        run: npm install --no-save wrangler@4

      - name: Apply D1 full schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 d1 execute warden-db --remote --file=sql/schema_full.sql --yes
          npx wrangler@4 d1 execute warden-db --remote --command "SELECT name FROM sqlite_master WHERE type='table';"

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
